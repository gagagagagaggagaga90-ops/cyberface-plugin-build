name: Build Cyberface Spreadsheet Importer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile plugin
        shell: powershell
        run: ./build.ps1
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: CyberfaceSpreadsheetImporter
          path: out/CyberfaceSpreadsheetImporter.dll
          if-no-files-found: error
